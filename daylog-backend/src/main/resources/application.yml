spring:
  profiles:
    default: dev
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

server:
  port: 8080

daylog:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  frontend-base-url: ${FRONTEND_BASE_URL:https://daylog.oquu.top}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD}
  weibo:
    app-key: ${WEIBO_APP_KEY:}
    app-secret: ${WEIBO_APP_SECRET:}
    redirect-uri: ${WEIBO_REDIRECT_URI:https://daylog.oquu.top/api/weibo/oauth/callback}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.daylog: DEBUG
    org.springframework.security: INFO
